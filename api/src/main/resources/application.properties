spring.application.name=gamificacao.grupo-7
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/${POSTGRES_DB:devops}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
scalar.enabled=true
scalar.url=https://example.com/openapi.json
scalar.path=/docs